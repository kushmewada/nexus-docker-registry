name: nexus

# Nexus as a private docker registry with nginx in front doing https.
#
# port mapping (host -> container):
#   ${NEXUS_UI_PORT}       nexus web UI + REST API   (nexus:8081)
#   ${REGISTRY_PUSH_PORT}  docker push, docker-hosted (nexus:8082)
#   ${REGISTRY_PULL_PORT}  docker pull, docker-group  (nexus:8083)
#
# nexus ports are not published on purpose, everything has to go through nginx.

services:
  nexus:
    image: sonatype/nexus3:${NEXUS_VERSION:-3.96.4}
    container_name: nexus
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms${NEXUS_HEAP:-2g} -Xmx${NEXUS_HEAP:-2g}
        -XX:MaxDirectMemorySize=${NEXUS_DIRECT_MEMORY:-2g}
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    volumes:
      - nexus-data:/nexus-data
    expose:
      - "8081"
      - "8082"
      - "8083"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status/writable || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: ${NEXUS_MEMORY_LIMIT:-6g}
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:${NGINX_VERSION:-1.31.7-alpine}
    container_name: nexus-proxy
    restart: unless-stopped
    depends_on:
      nexus:
        condition: service_healthy
    environment:
      NEXUS_HOST: ${NEXUS_HOST:-localhost}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${NEXUS_UI_PORT:-8443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${REGISTRY_PUSH_PORT:-5000}:5000"
      - "${BIND_ADDRESS:-0.0.0.0}:${REGISTRY_PULL_PORT:-5001}:5001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  nexus-data:
    name: nexus-data

networks:
  frontend:
    name: nexus-frontend
  # don't mark this internal, the proxy repo needs internet to reach docker hub
  backend:
    name: nexus-backend
